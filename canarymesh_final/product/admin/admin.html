<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Panel — CanaryMesh</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0A0F1E;--panel:#0F1628;--card:#141B35;--border:#1E2D55;
  --accent:#3B82F6;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--purple:#8B5CF6;
  --tp:#E2E8F0;--ts:#94A3B8;--tm:#475569;}
body{background:var(--bg);color:var(--tp);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;
  background:var(--panel);border-bottom:1px solid var(--border);}
.badge{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(139,92,246,0.2);
  color:var(--purple);border:1px solid rgba(139,92,246,0.4);font-weight:600;}
.content{padding:20px;max-width:900px;margin:0 auto;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.stat-val{font-size:26px;font-weight:700;margin-top:4px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.panel-title{font-size:13px;font-weight:600;color:var(--ts);margin-bottom:14px;}
.company-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:8px;}
.co-name{font-size:13px;font-weight:600;flex:1;}
.co-meta{font-size:11px;color:var(--tm);}
.plan-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="width:28px;height:28px;border-radius:7px;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;">⬡</div>
    <span style="font-size:15px;font-weight:700;">CanaryMesh</span>
    <span class="badge">TrustGrid ADMIN</span>
  </div>
  <a href="../auth/login.html" style="font-size:12px;color:var(--tm);">← Back to login</a>
</div>
<div class="content">
  <div class="grid3">
    <div class="stat"><div style="font-size:10px;color:var(--tm);">Registered companies</div>
      <div class="stat-val" id="compCount" style="color:var(--accent);">0</div></div>
    <div class="stat"><div style="font-size:10px;color:var(--tm);">Total nodes deployed</div>
      <div class="stat-val" id="nodeCount" style="color:var(--green);">0</div></div>
    <div class="stat"><div style="font-size:10px;color:var(--tm);">Platform status</div>
      <div class="stat-val" style="color:var(--green);font-size:16px;margin-top:8px;">● All systems go</div></div>
  </div>
  <div class="panel">
    <div class="panel-title">Registered companies</div>
    <div id="companiesList"><div style="color:var(--tm);font-size:12px;text-align:center;padding:30px;">No companies registered yet. <a href="../auth/register.html" style="color:var(--accent);">Register one →</a></div></div>
  </div>
</div>
<script>
const PLAN_COLORS = {Starter:'#94A3B8',Professional:'#10B981',Enterprise:'#8B5CF6'}
window.onload = () => {
  const companies = JSON.parse(localStorage.getItem('cm_companies')||'[]')
  const demo = {company:'Acme Corporation',email:'demo@acmecorp.com',industry:'Manufacturing',
    plan:'Professional',role:'SOC Admin',createdAt:new Date().toISOString()}
  const all = [demo,...companies]
  document.getElementById('compCount').textContent = all.length
  let totalNodes = all.length * 6
  document.getElementById('nodeCount').textContent = totalNodes
  const list = document.getElementById('companiesList')
  if (!all.length) return
  list.innerHTML = all.map(c=>{
    const color = PLAN_COLORS[c.plan]||'#94A3B8'
    return `<div class="company-row">
      <div style="font-size:22px">${{Manufacturing:'🏭',Automotive:'🚗',Pharma:'💊',Power_Grid:'⚡',Aerospace:'✈️'}[c.industry?.replace(' ','_')]||'🏢'}</div>
      <div style="flex:1">
        <div class="co-name">${c.company||'Unknown'}</div>
        <div class="co-meta">${c.email} · ${c.industry||'—'} · Registered ${new Date(c.createdAt||Date.now()).toLocaleDateString()}</div>
      </div>
      <span class="plan-tag" style="background:${color}20;color:${color};border:1px solid ${color}44">${c.plan||'Starter'}</span>
    </div>`
  }).join('')
}
</script>
</body>
</html>
